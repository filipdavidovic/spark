name: CrossJoinArrayContains Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - 'benchmark/**'
    paths:
      - 'sql/catalyst/src/main/scala/**/CrossJoinArrayContainsToInnerJoin.scala'
      - 'sql/core/src/test/scala/**/CrossJoinArrayContainsToInnerJoinBenchmark.scala'

jobs:
  benchmark:
    name: "CrossJoinArrayContains Benchmark (JDK ${{ matrix.java }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    env:
      SPARK_LOCAL_IP: localhost
      SPARK_HOME: ${{ github.workspace }}
    steps:
      - name: Checkout Spark repository
        uses: actions/checkout@v4

      - name: Cache SBT and Maven
        uses: actions/cache@v4
        with:
          path: |
            build/apache-maven-*
            build/*.jar
            ~/.sbt
          key: build-${{ hashFiles('**/pom.xml', 'project/build.properties', 'build/mvn', 'build/sbt', 'build/sbt-launch-lib.bash', 'build/spark-build-info') }}
          restore-keys: |
            build-

      - name: Cache Coursier local repository
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: benchmark-coursier-${{ matrix.java }}-${{ hashFiles('**/pom.xml', '**/plugins.sbt') }}
          restore-keys: |
            benchmark-coursier-${{ matrix.java }}

      - name: Install Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}

      - name: Show Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Run CrossJoinArrayContainsToInnerJoin Benchmark
        run: |
          # Configure logging to be less noisy
          cp conf/log4j2.properties.template conf/log4j2.properties
          sed -i 's/rootLogger.level = info/rootLogger.level = warn/g' conf/log4j2.properties

          # Run the benchmark
          SPARK_GENERATE_BENCHMARK_FILES=1 ./build/sbt \
            "sql/Test/runMain org.apache.spark.sql.execution.benchmark.CrossJoinArrayContainsToInnerJoinBenchmark" \
            2>&1 | tee benchmark-output-jdk${{ matrix.java }}.log

      - name: Extract benchmark results
        run: |
          echo "## Benchmark Results (JDK ${{ matrix.java }})" > benchmark-summary-jdk${{ matrix.java }}.md
          echo "" >> benchmark-summary-jdk${{ matrix.java }}.md
          echo '```' >> benchmark-summary-jdk${{ matrix.java }}.md
          grep -A 20 "Running benchmark:" benchmark-output-jdk${{ matrix.java }}.log | head -100 >> benchmark-summary-jdk${{ matrix.java }}.md || true
          echo '```' >> benchmark-summary-jdk${{ matrix.java }}.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-jdk${{ matrix.java }}
          path: |
            benchmark-output-jdk${{ matrix.java }}.log
            benchmark-summary-jdk${{ matrix.java }}.md
            benchmarks/CrossJoinArrayContainsToInnerJoinBenchmark-results.txt

  compare-results:
    name: Compare JDK 17 vs 21 Results
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Download JDK 17 results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-jdk17
          path: jdk17-results

      - name: Download JDK 21 results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-jdk21
          path: jdk21-results

      - name: Compare and summarize results
        run: |
          echo "# CrossJoinArrayContainsToInnerJoin Benchmark Comparison" > comparison.md
          echo "" >> comparison.md
          echo "## JDK 17 Results" >> comparison.md
          cat jdk17-results/benchmark-summary-jdk17.md >> comparison.md
          echo "" >> comparison.md
          echo "## JDK 21 Results" >> comparison.md
          cat jdk21-results/benchmark-summary-jdk21.md >> comparison.md
          echo "" >> comparison.md
          echo "---" >> comparison.md
          echo "*Generated at: $(date)*" >> comparison.md

          cat comparison.md

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: comparison.md
